name: Email Template Deployment

run-name: Sync email templates (${{ github.ref_name }})

on:
  push:
    branches: [main]
    tags: ['*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - test
          - prod

permissions:
  id-token: write
  contents: read

jobs:
  validate:
    name: Validate Email Templates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Validate Handlebars syntax
        run: |
          find lib/handlers/emailDispatch/templates -type f \( -name '*.html' -o -name '*.txt' \) -print0 |
          xargs -0 -I{} node -e "
            const fs = require('fs');
            const Handlebars = require('handlebars');
            const f = '{}';
            try {
              Handlebars.compile(fs.readFileSync(f, 'utf8'));
              console.log('OK', f);
            } catch (e) {
              console.error('FAIL', f, e.message);
              process.exit(1);
            }
          "

      - name: Run email dispatch tests
        run: yarn test emailDispatch.test.js

  deploy-dev:
    name: Deploy to Dev
    runs-on: ubuntu-latest
    needs: validate
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'dev')
    environment: reserveRecApiDev
    concurrency:
      group: email-templates-dev
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - name: Get AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          role-session-name: GitHub_to_AWS_via_FederatedOIDC
          aws-region: ${{ vars.AWS_REGION }}

      - name: Sync templates to S3
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
        run: |
          chmod +x src/scripts/sync-email-templates.sh
          src/scripts/sync-email-templates.sh dev

  deploy-test:
    name: Deploy to Test
    runs-on: ubuntu-latest
    needs: validate
    if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')) || (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'test')
    environment: reserveRecApiTest
    concurrency:
      group: email-templates-test
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - name: Get AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          role-session-name: GitHub_to_AWS_via_FederatedOIDC
          aws-region: ${{ vars.AWS_REGION }}

      - name: Sync templates to S3
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
        run: |
          chmod +x src/scripts/sync-email-templates.sh
          src/scripts/sync-email-templates.sh test

  deploy-prod:
    name: Deploy to Prod
    runs-on: ubuntu-latest
    needs: validate
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'prod'
    environment: reserveRecApiProd
    concurrency:
      group: email-templates-prod
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - name: Get AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          role-session-name: GitHub_to_AWS_via_FederatedOIDC
          aws-region: ${{ vars.AWS_REGION }}

      - name: Sync templates to S3
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
        run: |
          chmod +x src/scripts/sync-email-templates.sh
          src/scripts/sync-email-templates.sh prod
